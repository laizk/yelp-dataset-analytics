services:

  kafka:
    image: apache/kafka:latest
    hostname: broker
    container_name: streaming-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - common


  # Create kafka topics on startup
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      - kafka
    restart: on-failure
    networks:
      - common
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      sleep 10
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server broker:29092 --partitions 3 --replication-factor 1 --topic raw_data
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server broker:29092 --partitions 3 --replication-factor 1 --topic raw_data_business
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server broker:29092 --partitions 3 --replication-factor 1 --topic raw_data_checkin
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server broker:29092 --partitions 3 --replication-factor 1 --topic raw_data_user
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server broker:29092 --partitions 3 --replication-factor 1 --topic raw_data_review
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server broker:29092 --partitions 3 --replication-factor 1 --topic raw_data_tip
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server broker:29092 --partitions 3 --replication-factor 1 --topic consolidated_data
      /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server broker:29092
      echo 'Topics created successfully'
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:29092"
    networks:
      - common      

  minio:
    image: quay.io/minio/minio:latest
    container_name: storage-minio
    environment:
      MINIO_ROOT_USER: ${DATA_LAKE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${DATA_LAKE_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - common
    volumes:
      - ./apps/storage/minio/data:/data

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    networks:
      - common
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 ${DATA_LAKE_ACCESS_KEY_ID} ${DATA_LAKE_SECRET_ACCESS_KEY};
      /usr/bin/mc mb dockerminio/dlq;
      /usr/bin/mc mb dockerminio/bronze;
      /usr/bin/mc mb dockerminio/silver;
      /usr/bin/mc mb dockerminio/gold;
      exit 0;
      "

  spark:
    build: ./apps/batch/spark
    container_name: batch-spark
    depends_on:
      - kafka
      - minio
      - createbuckets
    environment:
      - DATA_LAKE_ENDPOINT=${DATA_LAKE_ENDPOINT}
      - DATA_LAKE_ACCESS_KEY_ID=${DATA_LAKE_ACCESS_KEY_ID}
      - DATA_LAKE_SECRET_ACCESS_KEY=${DATA_LAKE_SECRET_ACCESS_KEY}
      - DATA_LAKE_REGION=us-east-1
      - KAFKA_BOOTSTRAP=broker:29092
    volumes:
      - ./apps/batch/spark:/app
      - ./apps/batch/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf      
    networks:
      - common
    ports:
      - "4040:4040"
      - "8081:8080"
      - "8000:8000"
    command: ["/bin/bash"]
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
    

  jupyter:
    build: ./apps/analytics/jupyter
    container_name: analytics-jupyter
    environment:
      - DATA_LAKE_ENDPOINT=${DATA_LAKE_ENDPOINT}
      - DATA_LAKE_ACCESS_KEY_ID=${DATA_LAKE_ACCESS_KEY_ID}
      - DATA_LAKE_SECRET_ACCESS_KEY=${DATA_LAKE_SECRET_ACCESS_KEY}
      - DATA_LAKE_REGION=us-east-1
      - KAFKA_BOOTSTRAP=broker:29092
    ports:
      - "8888:8888"
    volumes:
      - ./apps/analytics/jupyter/workspace:/workspace
      - ./apps/batch/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf 
    networks:
      - common
    depends_on:
      - minio
      - createbuckets
      - kafka

  mongodb:
    image: mongo:latest
    container_name: storage-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./apps/storage/mongodb/data/initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro    
      - mongodb-data:/data/db/
      - mongodb-log:/var/log/mongodb/
    networks:
      - common      

  mongo-express:
    image: mongo-express:latest
    container_name: storage-mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "8082:8081"
    networks:
      - common
    depends_on:
      - mongodb

  fastapi:
    depends_on:
      - kafka
    build:
      context: ./apps/api/fastapi
      dockerfile: Dockerfile
    container_name: backend-fastapi
    restart: always
    ports:
      - "8010:8010"
    environment:
      ENV: "development"
      KAFKA_BOOTSTRAP_SERVERS: "broker:29092"
      KAFKA_TOPIC_BUSINESS: "raw_data"      
    networks:
      - common
    volumes:
      - ./apps/api/fastapi:/app  # remove this in production

  streamlit:
    depends_on:
      - kafka
    build:
      context: ./apps/ui/streamlit
      dockerfile: Dockerfile
    container_name: frontend-streamlit
    restart: always
    ports:
      - "8501:8501"
    environment:
      ENV: "development"
    volumes:
      - ./apps/ui/streamlit:/app     # <— THIS enables hot reload      
    networks:
      - common

  dbt:
    build:
      context: ./apps/batch/dbt
      dockerfile: Dockerfile
    container_name: batch-dbt
    volumes:
      - ./apps/batch/dbt:/dbt
    working_dir: /dbt
    environment:
      DBT_PROFILES_DIR: /dbt
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    networks:
      - common
    # depends_on:
      # - duckdb 
  

  # prometheus:
