  #     GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
  #   networks:
  #     - common  

volumes:
  mongodb-data:
    driver: local
    name: mongo-data
  mongodb-log:
    driver: local
    name: mongo-log  
  postgres-data:
    driver: local
    name: postgres-data
  clickhouse-data:
    driver: local
    name: clickhouse-data

networks:
  common:
    driver: bridge
    name: common
