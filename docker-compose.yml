  # grafana:
  #   image: grafana/grafana-enterprise
  #   container_name: grafana
  #   restart: unless-stopped
  #   ports:
  #     - '3000:3000'    
  #   environment:
  #     GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
  #     GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
  #   networks:
  #     - common  

volumes:
  mongodb-data:
    driver: local
    name: mongo-data
  mongodb-log:
    driver: local
    name: mongo-log  

networks:
  common:
    driver: bridge
