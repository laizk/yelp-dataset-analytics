default:
  target: clickhouse
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', 5432) | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'analytics') }}"
      schema: public
      threads: 4
    clickhouse:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', 8123) | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'clickhouse') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'clickhouse123') }}"
      database: "{{ env_var('CLICKHOUSE_DB', 'analytics') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'analytics') }}"
      threads: 4
